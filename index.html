<style>
:root{box-sizing:border-box;--g:#00c764;--m:#9fd8b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;padding:0;min-height:100vh;min-height:100dvh;height:100%;display:flex;justify-content:center;align-items:stretch;font-family:Urbanist,"Segoe UI",system-ui,sans-serif;color:#fff;background:#010805;overflow-x:hidden}
/* Wide screen: show decorative background + centered card */
@media(min-width:600px){body{background:#010805 radial-gradient(ellipse 60% 70% at 20% 50%,#04452a55,transparent 70%),radial-gradient(ellipse 50% 60% at 80% 50%,#04452a44,transparent 70%);align-items:center;padding:24px 0}.app{border-radius:44px;min-height:min(860px,96vh);height:min(860px,96vh);box-shadow:0 0 0 1px #ffffff18,0 40px 100px #000c,0 0 80px -20px #00c76433}}
.app{position:relative;width:100%;max-width:480px;min-height:100vh;min-height:100dvh;height:100%;margin:0 auto;border:0;border-radius:0;overflow:hidden;background:linear-gradient(180deg,#0dc46a 0,#0a9455 12%,#04452a 24%,#010805 36%,#000 50%);box-shadow:none}
.isl{display:none!important}
#view{position:absolute;inset:0;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(88px + env(safe-area-inset-bottom,0px));scrollbar-width:none;-webkit-overflow-scrolling:touch;transform:translateZ(0);will-change:scroll-position}
#view::-webkit-scrollbar{display:none}
.bar{display:flex;justify-content:space-between;margin-bottom:20px}
.gb{width:52px;height:52px;border-radius:50%;background:#0b8f4d99;border:0;color:#dff;display:grid;place-items:center;font:600 20px Urbanist;cursor:pointer;box-shadow:inset 0 0 0 1px #ffffff14}
.lb{font-size:18px;color:#d4f3e2;font-weight:500}
.bal{font-size:54px;font-weight:600;letter-spacing:-1.5px;line-height:1.1;background:linear-gradient(180deg,#fff 20%,#a8dcc0);-webkit-background-clip:text;background-clip:text;color:transparent}
.acts{display:flex;gap:10px;margin:14px 0 20px}
.act{flex:1;background:#0b8f4d88;border:0;border-radius:18px;color:#fff;padding:12px 4px;font:600 14px Urbanist;cursor:pointer;box-shadow:inset 0 0 0 1px #ffffff14}
.act span{display:block;font-size:20px;margin-bottom:2px}
h3{margin:18px 0 10px;font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
h3 a{font-size:14px;color:var(--m);font-weight:500;cursor:pointer}
.ppl{display:flex;justify-content:space-between}
.pp{width:64px;text-align:center;font-size:11px;font-weight:500;cursor:pointer}
.av{width:56px;height:56px;border-radius:50%;border:3px solid #0b1a13;box-shadow:0 0 0 1px #ffffff26;overflow:hidden;margin:0 auto 5px}
.stack{position:relative;height:292px;cursor:pointer}
.card{position:absolute;left:0;width:360px;height:250px;clip-path:path("M0 32Q0 8 26 8L110 8C140 8 140 22 170 22L192 22C222 22 222 0 254 0L334 0Q360 0 360 26L360 250L0 250Z");padding:34px 22px}
.card b{font-size:14px;font-weight:600}.card i{position:absolute;right:22px;top:26px;font-size:26px;font-weight:800;letter-spacing:-1px}
.k1{top:0;background:#111d24}.k2{top:56px;background:#00c95f}.k3{top:112px;background:#040404}
.num{position:absolute;left:22px;right:22px;top:72px;display:flex;justify-content:space-between;font:500 26px "Space Grotesk",monospace}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff14;cursor:pointer}
.ic{width:42px;height:42px;border-radius:50%;background:#0b8f4d66;display:grid;place-items:center;font-weight:700}
.tx div:nth-child(2){flex:1}.tx small{display:block;color:var(--m);font-size:12px}
.pos{color:#3dff85}.pend{color:#f5e63a;font-size:11px}
nav{position:absolute;left:0;right:0;bottom:0;height:74px;background:#000d;border-top:1px solid #ffffff14;display:flex;z-index:8;padding-bottom:8px}
nav button{flex:1;background:0;border:0;color:#6fa88a;font:600 11px Urbanist;cursor:pointer}
nav button span{display:block;font-size:22px}nav .on{color:#fff}nav .on span{color:var(--g)}
.chips{display:flex;gap:8px;margin:12px 0;overflow-x:auto}
.chip{padding:7px 14px;border-radius:18px;border:1.5px solid #ffffff40;background:0;color:#fff;font:600 13px Urbanist;cursor:pointer;white-space:nowrap}
.chip.on{background:#fff;color:#111}
input{width:100%;background:#0b8f4d55;border:0;border-radius:16px;padding:13px 16px;color:#fff;font:500 16px Urbanist;outline:none}
input::placeholder{color:#8fc7a8}
.amt{font-size:56px;font-weight:700;text-align:center;margin:8px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.pad button{height:54px;border-radius:16px;border:0;background:#ffffff14;color:#fff;font:600 24px Urbanist;cursor:pointer}
.go{width:100%;height:54px;border:0;border-radius:27px;background:var(--g);color:#04231a;font:800 18px Urbanist;cursor:pointer}
.tip{background:#fff;color:#111;border-radius:12px;padding:6px 12px;font-weight:700;font-size:15px;line-height:1.15;display:inline-block}
.tip small{display:block;color:#777;font-weight:500;font-size:12px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #ffffff14;font-weight:600}
.sw{width:50px;height:28px;border-radius:14px;background:#333;position:relative;cursor:pointer}.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--g)}.sw.on:after{left:25px}
.ok{width:96px;height:96px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-size:52px;margin:90px auto 20px;color:#04231a}
#toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 16px;border-radius:20px;font-weight:700;font-size:14px;z-index:20;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.s{opacity:1}

#view{bottom:0!important;padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))!important}
.gb,.act,.ic,.chip:not(.on){position:relative;border:0;color:#fff;background:radial-gradient(75% 48% at 28% 6%,#ffffff8c,transparent 70%),linear-gradient(140deg,#ffffff40,#ffffff0d 45%,#ffffff26);box-shadow:inset 1.5px 1.5px 1px #ffffffa6,inset -1px -1px 1.5px #ffffff4d,inset 0 0 14px #ffffff17,0 8px 22px #0000004d}
.act{border-radius:22px;padding:14px 4px}
.act span{display:grid;place-items:center;margin-bottom:5px;font-size:0}
.gb svg,.ic svg{filter:drop-shadow(0 1px 2px #00000055)}
#ov{position:absolute;inset:0;background:#000a;opacity:0;pointer-events:none;transition:.3s;z-index:10}#ov.on{opacity:1;pointer-events:auto}
#dr{position:absolute;top:0;bottom:0;left:0;width:290px;z-index:11;transform:translateX(-106%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding:64px 16px 20px;border-radius:0 44px 44px 0;background:radial-gradient(90% 30% at 25% 0,#ffffff59,transparent 70%),linear-gradient(160deg,#ffffff38,#ffffff0f 50%,#ffffff21);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 2px 2px 1px #ffffff8c,inset -1px -1px 2px #ffffff40,24px 0 60px #000a}
#dr.on{transform:none}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:8px;margin:6px 0;border:0;border-radius:26px;background:0;color:#fff;font:600 18px Urbanist;cursor:pointer;text-align:left}
.item.on{background:#ffffff26;box-shadow:inset 1px 1px 1px #ffffff80,inset -1px -1px 1px #ffffff26}
.item .ic{width:46px;height:46px;flex:none}
.ok{background:radial-gradient(70% 50% at 30% 8%,#ffffffb0,transparent 70%),linear-gradient(140deg,#7dffb8,#00c764 55%,#079a52);box-shadow:inset 2px 2px 2px #ffffffb3,inset -2px -2px 4px #0003,0 14px 40px #00c76488}
.fl{font-size:13px;color:var(--m);margin:14px 0 6px;font-weight:600}.del{width:30px;height:30px;border-radius:50%;border:0;background:#ffffff1f;display:grid;place-items:center;cursor:pointer;flex:none}.del svg{opacity:.8}
.pn{border-radius:26px;padding:16px;background:radial-gradient(75% 40% at 28% 0,#ffffff40,transparent 70%),linear-gradient(140deg,#ffffff30,#ffffff0a 50%,#ffffff1c);box-shadow:inset 1.5px 1.5px 1px #ffffff80,inset -1px -1px 1.5px #ffffff33,0 8px 22px #0000004d}
.cr{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;font-weight:500}.cd{width:10px;height:10px;border-radius:50%}.cn{flex:1}.cr span:nth-child(3){color:var(--m)}.cb{height:5px;border-radius:3px;background:#ffffff1a;margin-top:6px}.cb i{display:block;height:100%;border-radius:3px}
.dot{position:absolute;top:11px;right:12px;width:10px;height:10px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 2px #0b8f4d}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ct{border:0;border-radius:20px;padding:12px 4px;color:#fff;font:600 12px Urbanist;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;background:radial-gradient(75% 48% at 28% 6%,#ffffff59,transparent 70%),linear-gradient(140deg,#ffffff33,#ffffff0d 45%,#ffffff1f);box-shadow:inset 1.5px 1.5px 1px #ffffff99,inset -1px -1px 1.5px #ffffff40,0 8px 20px #0000004d}
.ct.on{background:radial-gradient(75% 48% at 28% 6%,#ffffffb3,transparent 70%),linear-gradient(140deg,#3dff85,#00c764 50%,#079a52);box-shadow:inset 2px 2px 2px #ffffffb3,0 8px 22px #00c76488}
.ct .ic{width:40px;height:40px}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
